
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Station Gambetta</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        header {
            background-color: #000;
            text-align: center;
            padding: 40px 20px;
        }
        header img {
            width: 150px;
        }
        .main-title {
            color: #FFD700;
            font-size: 2.5em;
            margin-top: 10px;
        }
        .info {
            margin: 20px;
            text-align: center;
        }
        .info p {
            font-size: 1.2em;
        }
        .photos {
            text-align: center;
            margin: 40px 0;
        }
        .photos img {
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo Station Gambetta">
        <div class="main-title">La Station Gambetta</div>
    </header>
    <div class="info">
        <p>Tél : 04 67 17 48 28</p>
        <p>Horaires : 10h30 - 01h00</p>
    </div>
    <div class="photos">
        <img src="burger.jpg" alt="Burger maison">
    </div>
</body>
</html>
