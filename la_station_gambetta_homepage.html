
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Station Gambetta</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        header {
            background-color: #000;
            text-align: center;
            padding: 40px 20px;
        }
        header img {
            width: 150px;
        }
        .main-title {
            color: #FFD700;
            font-size: 2.5em;
            margin-top: 10px;
        }
        .section {
            padding: 30px 20px;
            text-align: center;
        }
        .yellow-text {
            color: #FFD700;
        }
        .split {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background-color: #FFD700;
            color: #000;
        }
        .split .text, .split .image {
            flex: 1 1 300px;
            padding: 20px;
        }
        .split img {
            max-width: 100%;
            border-radius: 10px;
        }
        footer {
            background-color: #000;
            color: #FFD700;
            padding: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="La Station Gambetta Logo">
        <div class="main-title">LA STATION GAMBETTA</div>
        <p>65 Cours Gambetta, 34000 Montpellier</p>
    </header>
    <div class="section">
        <h2 class="yellow-text">RESTAURATION RAPIDE</h2>
        <p>Pizzas · Tacos/Gratiné · Panini · Burgers</p>
    </div>
    <div class="split">
        <div class="text">
            <h3>Horaires</h3>
            <p>10h30 - 01h00</p>
            <h3>Tel</h3>
            <p>04 67 17 48 28</p>
        </div>
        <div class="image">
            <img src="burger.jpg" alt="Burger La Station Gambetta">
        </div>
    </div>
    <footer>
        Suivez-nous sur les réseaux sociaux
    </footer>
</body>
</html>
